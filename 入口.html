<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026青春杯羽毛球赛 · 参赛查询</title>
<script src="data.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f4f7; color: #1f2533; overflow-x: hidden; }
  .wrap { max-width: 720px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }
  header { background: linear-gradient(135deg, #2e7d5b, #1b5e43); color: #fff; padding: 22px 18px 18px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header p { margin: 6px 0 0; font-size: 12px; opacity: .85; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #e6e9ef; position: sticky; top: 0; z-index: 10; }
  .tabs button { flex: 1; padding: 13px 0; border: 0; background: none; font-size: 15px; font-weight: 600; color: #7a8597; cursor: pointer; position: relative; }
  .tabs button.on { color: #2e7d5b; }
  .tabs button.on::after { content: ''; position: absolute; left: 25%; right: 25%; bottom: 0; height: 3px; background: #2e7d5b; border-radius: 3px 3px 0 0; }
  .panel { display: none; padding: 14px; }
  .panel.on { display: block; }
  .searchbox { display: flex; align-items: center; background: #fff; border: 1px solid #dfe3ea; border-radius: 12px; padding: 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .searchbox span { font-size: 18px; color: #9aa3b2; }
  .searchbox input { flex: 1; border: 0; outline: 0; padding: 13px 8px; font-size: 16px; background: none; }
  .hint { font-size: 12px; color: #9aa3b2; margin: 10px 2px 4px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-top: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .result-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 4px; border-bottom: 1px solid #f0f2f6; cursor: pointer; }
  .result-item:last-child { border-bottom: 0; }
  .result-item .left { flex: 1; min-width: 0; }
  .result-item .nm { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-item .meta { font-size: 12px; color: #8b95a5; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; }
  .tag.am { background: #fff3e0; color: #d97a08; }
  .tag.pm { background: #e8f0fe; color: #2b6cb0; }
  .tag.male { background: #e8f5ee; color: #2e7d5b; }
  .tag.female { background: #fce8f0; color: #c2185b; }
  .profile-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,#2e7d5b,#1b5e43); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .profile-top .nm { font-size: 19px; font-weight: 700; }
  .profile-top .sub { font-size: 12px; color: #8b95a5; margin-top: 3px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .info-row { display: flex; padding: 9px 0; border-bottom: 1px solid #f4f5f8; font-size: 14px; }
  .info-row:last-child { border-bottom: 0; }
  .info-row .k { color: #8b95a5; width: 74px; flex-shrink: 0; }
  .info-row .v { color: #1f2533; font-weight: 500; }
  .sec-title { font-size: 15px; font-weight: 700; margin: 18px 2px 8px; color: #2e7d5b; }
  .mates { display: flex; flex-wrap: wrap; gap: 6px; }
  .mate { background: #f2f6f4; color: #366; font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  table.mt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mt th { text-align: left; color: #8b95a5; font-weight: 600; padding: 8px 4px; border-bottom: 1px solid #eef0f4; font-size: 12px; }
  table.mt td { padding: 10px 4px; border-bottom: 1px solid #f4f5f8; }
  table.mt tr:last-child td { border-bottom: 0; }
  .court { color: #2e7d5b; font-weight: 600; }
  .empty { text-align: center; color: #9aa3b2; padding: 30px 0; font-size: 14px; }
  .gcard { margin-bottom: 10px; }
  .gcard .gh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .gcard .gt { font-size: 15px; font-weight: 700; }
  .gmem { font-size: 13px; color: #4a5468; line-height: 1.9; }
  .gmem span { display: inline-block; background: #f5f7fa; padding: 2px 8px; border-radius: 6px; margin: 0 4px 4px 0; }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 0; border: 1px solid #dfe3ea; background: #fff; border-radius: 9px; font-size: 13px; color: #7a8597; cursor: pointer; }
  .seg button.on { background: #2e7d5b; color: #fff; border-color: #2e7d5b; font-weight: 600; }
  .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .mini { background: #fff; border-radius: 10px; padding: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .mini .h { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .mini .l { font-size: 12px; color: #5a6478; line-height: 1.7; }
  .m-filter { display: flex; gap: 8px; margin-bottom: 10px; }
  .m-filter select { flex: 1; padding: 10px; border: 1px solid #dfe3ea; border-radius: 9px; font-size: 14px; background: #fff; color: #1f2533; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid #f4f5f8; font-size: 13px; }
  .mrow:last-child { border-bottom: 0; }
  .mrow .rd { color: #8b95a5; width: 62px; flex-shrink: 0; font-size: 12px; }
  .mrow .ct { color: #2e7d5b; font-weight: 600; width: 46px; flex-shrink: 0; }
  .mrow .vs { flex: 1; }
  /* 淘汰赛 */
  .bt-title { font-size: 16px; font-weight: 700; color: #2e7d5b; margin-bottom: 6px; }
  .bt-note { font-size: 12px; color: #8b95a5; line-height: 1.7; margin-bottom: 10px; }
  .bt-sec { font-size: 14px; font-weight: 700; color: #1f2533; margin: 14px 0 8px; padding-left: 8px; border-left: 3px solid #2e7d5b; }
  .bt-r16 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .bt-m { background: #fafbfd; border: 1px solid #e6e9ef; border-radius: 9px; padding: 7px 8px; }
  .bt-h { font-size: 11px; color: #9aa3b2; margin-bottom: 5px; }
  .bt-p { display: flex; align-items: flex-start; gap: 5px; padding: 3px 0; min-width: 0; }
  .bt-g { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: #f0f2f6; color: #4a5468; white-space: nowrap; flex-shrink: 0; }
  .bt-g.am { background: #fff3e0; color: #d97a08; }
  .bt-g.pm { background: #e8f0fe; color: #2b6cb0; }
  .bt-n { font-size: 10px; color: #8b95a5; line-height: 1.5; word-break: break-all; }
  .bt-q { font-size: 10px; color: #8b95a5; line-height: 1.5; margin: 1px 0 5px 2px; word-break: break-all; }
  .bt-sf { display: flex; flex-wrap: wrap; gap: 6px; }
  .bt-sfitem { font-size: 12px; background: #e8f5ee; color: #2e7d5b; padding: 5px 10px; border-radius: 8px; font-weight: 600; }
  .bt-who { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .bt-nm { font-size: 12px; font-weight: 700; color: #c00000; }
  .bt-tbd { font-size: 10px; color: #b0b8c4; border: 1px dashed #d5dae2; border-radius: 4px; padding: 0 4px; }
  .bt-foot { font-size: 11px; color: #9aa3b2; margin-top: 10px; line-height: 1.6; }
  footer { text-align: center; font-size: 11px; color: #aab2bf; padding: 20px 12px 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2026青春杯羽毛球赛 · 参赛查询</h1>
    <p>查自己时段 / 小组 / 对阵，也可浏览全部赛程</p>
  </header>
  <div class="tabs">
    <button id="tab-me" class="on" onclick="switchTab('me')">👤 查自己</button>
    <button id="tab-all" onclick="switchTab('all')">📋 看整体</button>
  </div>

  <!-- 查自己 -->
  <div class="panel on" id="panel-me">
    <div class="searchbox"><span>🔍</span><input id="q" type="text" placeholder="输入姓名（可只输一部分）" autocomplete="off"></div>
    <div class="hint">支持模糊搜索，例如输入「李」或「雨」</div>
    <div id="result"></div>
  </div>

  <!-- 看整体 -->
  <div class="panel" id="panel-all">
    <div class="seg">
      <button id="seg-group" class="on" onclick="switchSeg('group')">小组分组</button>
      <button id="seg-match" onclick="switchSeg('match')">完整对阵表</button>
      <button id="seg-elim" onclick="switchSeg('elim')">淘汰赛</button>
    </div>
    <div id="all-group"></div>
    <div id="all-match" style="display:none"></div>
    <div id="all-elim" style="display:none"></div>
  </div>

  <footer>数据以赛程表为准 · 仅供参考<span id="ver"> · 版本 11-28d</span></footer>
</div>
<script src="data.js"></script>
<script>
var D = window.DATA;
var $ = function(id){ return document.getElementById(id); };

function switchTab(t){
  $('tab-me').className = t==='me'?'on':'';
  $('tab-all').className = t==='all'?'on':'';
  $('panel-me').className = 'panel'+(t==='me'?' on':'');
  $('panel-all').className = 'panel'+(t==='all'?' on':'');
}
function switchSeg(s){
  $('seg-group').className = s==='group'?'on':'';
  $('seg-match').className = s==='match'?'on':'';
  $('seg-elim').className = s==='elim'?'on':'';
  $('all-group').style.display = s==='group'?'block':'none';
  $('all-match').style.display = s==='match'?'block':'none';
  $('all-elim').style.display = s==='elim'?'block':'none';
}

function tagSession(s){ return '<span class="tag '+(s==='上午'?'am':'pm')+'">'+s+'</span>'; }
function tagGender(g){ return '<span class="tag '+(g==='男'?'male':'female')+'">'+(g==='男'?'男单':'女单')+'</span>'; }

function renderList(kw){
  kw = kw.trim();
  var box = $('result');
  if(!kw){ box.innerHTML = '<div class="empty">输入姓名开始查询</div>'; return; }
  var arr = D.players.filter(function(p){ return p.name.indexOf(kw)>=0; });
  if(!arr.length){ box.innerHTML = '<div class="empty">没有找到「'+kw+'」，请检查姓名</div>'; return; }
  var h = '<div class="card">';
  arr.forEach(function(p){
    h += '<div class="result-item" onclick="showDetail(\''+p.code+'\')">'
       + '<div class="left"><div class="nm">'+p.name+'</div><div class="meta">'+p.college+' · '+p.groupLabel+'</div></div>'
       + tagSession(p.session)+'</div>';
  });
  h += '</div>';
  box.innerHTML = h;
}

function showDetail(code){
  var p = D.players.filter(function(x){return x.code===code;})[0];
  if(!p) return;
  var h = '<div class="card">'
    + '<div class="profile-top"><div class="avatar">'+p.name.charAt(0)+'</div>'
    + '<div><div class="nm">'+p.name+'</div><div class="sub">'+p.code+' · '+p.college+'</div></div></div>'
    + '<div class="badges">'+tagGender(p.gender)+tagSession(p.session)+'<span class="tag male">'+p.groupLabel+'</span></div>'
    + '<div class="info-row"><span class="k">比赛时段</span><span class="v">'+p.session+'</span></div>'
    + '<div class="info-row"><span class="k">学院</span><span class="v">'+p.college+'</span></div>'
    + '</div>';

  h += '<div class="card"><div class="sec-title" style="margin-top:0">本组成员</div><div class="mates">'
     + '<span class="mate">'+p.code+' '+p.name+'（本人）</span>'
     + p.mates.map(function(m){return '<span class="mate">'+m+'</span>';}).join('')
     + '</div></div>';

  h += '<div class="card"><div class="sec-title" style="margin-top:0">我的对阵表</div>';
  if(!p.matches.length){ h += '<div class="empty">暂无对阵安排</div>'; }
  else {
    h += '<table class="mt"><tr><th>时段</th><th>轮次</th><th>场地</th><th>对手</th></tr>';
    p.matches.forEach(function(m){
      h += '<tr><td>'+m.session+'</td><td>第'+m.round+'轮</td>'
         + '<td class="court">'+m.court+'号场</td><td>'+m.opponentName+'（'+m.opponent+'）</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';
  h += '<div style="text-align:center;margin-top:14px"><button onclick="backToList()" style="padding:10px 24px;border:0;background:#2e7d5b;color:#fff;border-radius:9px;font-size:14px;cursor:pointer">← 返回搜索</button></div>';
  $('result').innerHTML = h;
  window.scrollTo(0,0);
}
function backToList(){ renderList($('q').value); window.scrollTo(0,0); }

$('q').addEventListener('input', function(){ renderList(this.value); });

// 小组分组
(function(){
  var h = '';
  ['上午','下午'].forEach(function(sess){
    h += '<div class="sec-title">'+sess+'小组赛</div><div class="grid-cards">';
    D.groups.filter(function(g){return g.session===sess;}).forEach(function(g){
      h += '<div class="mini"><div class="h">'+(g.gender==='男'?'男':'女')+g.label+'组</div><div class="l">'
         + g.members.map(function(m){return m;}).join('<br>')+'</div></div>';
    });
    h += '</div>';
  });
  $('all-group').innerHTML = h;
})();

// 完整对阵表
(function(){
  var h = '<div class="m-filter"><select id="sel-sess" onchange="renderMatches()">'
        + '<option value="上午">上午小组赛</option><option value="下午">下午小组赛</option></select>'
        + '<select id="sel-court" onchange="renderMatches()"></select></div><div id="match-list" class="card"></div>';
  $('all-match').innerHTML = h;
  var sel = $('sel-court');
  sel.innerHTML = '<option value="0">全部场地</option>';
  for(var i=1;i<=10;i++){ sel.innerHTML += '<option value="'+i+'">'+i+'号场</option>'; }
  renderMatches();
})();

function codeName(c){ var p=D.players.filter(function(x){return x.code===c;})[0]; return p?p.name:c; }
function renderMatches(){
  var sess = $('sel-sess').value, court = parseInt($('sel-court').value);
  var arr = D.matches[sess].filter(function(m){ return !court || m.court===court; });
  var h = '<table class="mt"><tr><th>轮次</th><th>场地</th><th>对阵</th></tr>';
  arr.forEach(function(m){
    h += '<tr><td>第'+m.round+'轮</td><td class="court">'+m.court+'号场</td>'
       + '<td>'+codeName(m.a)+'（'+m.a+'）<br>vs '+codeName(m.b)+'（'+m.b+'）</td></tr>';
  });
  h += '</table><div class="hint">共 '+arr.length+' 场</div>';
  $('match-list').innerHTML = h;
}

/* ===== 淘汰赛 ===== */
/* 出线名单：上午 18 组已定；下午 16 组待填(null) */
var QUAL = {
  '男': {'a':'李世轩','b':'龚靖洋','c':'秦赫阳','d':'李艺超','e':'方彦林','f':'佘伟铭','g':'赵彦铭','h':'李沈君'},
  '女': {'A':'孙婉桐','B':'游宇彤','C':'唐思齐','D':'李秋颖','E':'李笑语','F':'陶霞','G':'谢昊辰','H':'张睿','I':'薛淑馨','J':'梅雅萱'}
};
var ELIM = {
  '男': {
    r16: [['a','p'],['b','o'],['c','n'],['d','m'],['e','l'],['f','k'],['g','j'],['h','i']],
    qf:  [[1,2],[3,4],[5,6],[7,8]]
  },
  '女': {
    r16: [['A','P'],['B','O'],['C','N'],['D','M'],['E','L'],['F','K'],['G','J'],['H','I']],
    qf:  [[1,2],[3,4],[5,6],[7,8]]
  }
};
function groupNames(g){
  var arr = D.groups.filter(function(x){return x.gender===g.gender && x.label===g.label;})[0];
  if(!arr) return [];
  return arr.members.map(function(s){ return s.split(' ')[1] || s; });
}
function groupSession(gender, label){
  var g = D.groups.filter(function(x){return x.gender===gender && x.label===label;})[0];
  return g ? g.session : '';
}
function slotName(gender, label){
  var m = QUAL[gender] || {};
  return m[label] || null;
}
function slotHTML(gender, label){
  var sess = groupSession(gender, label);
  var cls  = sess==='上午' ? 'bt-g am' : 'bt-g pm';
  var nm   = slotName(gender, label);
  var head = '<span class="'+cls+'">'+label+'组第1</span>';
  if(nm){ return '<span class="bt-who">'+head+'<b class="bt-nm">'+nm+'</b></span>'; }
  return '<span class="bt-who">'+head+'<span class="bt-tbd">待定</span></span>';
}
function bracketHTML(gender){
  var E = ELIM[gender], gl = gender==='男'?'男单':'女单';
  var h = '<div class="card">'
    + '<div class="bt-title">'+gl+'淘汰赛</div>'
    + '<div class="bt-note">小组第一名出线（胜场多者；同胜场先看相互战绩，再看净胜分）。'
    + '第一轮 8 场，胜者进入第二轮；第二轮 4 场，胜者即为四强。'
    + '16进8 16:10-17:10 · 8进4 17:20-18:20。</div>';

  // 第一轮
  h += '<div class="bt-sec">第一轮 · 16进8</div><div class="bt-r16">';
  E.r16.forEach(function(pair, i){
    var na = groupNames({gender:gender, label:pair[0]});
    var nb = groupNames({gender:gender, label:pair[1]});
    h += '<div class="bt-m">'
       + '<div class="bt-h">第'+(i+1)+'场</div>'
       + '<div class="bt-p">'+slotHTML(gender, pair[0])+'</div>'
       + '<div class="bt-q">'+na.join(' / ')+'</div>'
       + '<div class="bt-p">'+slotHTML(gender, pair[1])+'</div>'
       + '<div class="bt-q">'+nb.join(' / ')+'</div>'
       + '</div>';
  });
  h += '</div>';

  // 第二轮
  h += '<div class="bt-sec">第二轮 · 8进4</div><div class="bt-r16">';
  E.qf.forEach(function(pair, i){
    h += '<div class="bt-m">'
       + '<div class="bt-h">第'+(9+i)+'场</div>'
       + '<div class="bt-p"><span class="bt-g">第'+pair[0]+'场胜者</span><span class="bt-tbd">待定</span></div>'
       + '<div class="bt-p"><span class="bt-g">第'+pair[1]+'场胜者</span><span class="bt-tbd">待定</span></div>'
       + '</div>';
  });
  h += '</div>';

  // 四强
  h += '<div class="bt-sec">四强（第二轮 4 场胜者）</div><div class="bt-sf">';
  for(var i=0;i<4;i++){
    h += '<span class="bt-sfitem">'+gender+(i+1)+' ← 第'+(9+i)+'场胜者</span>';
  }
  h += '</div>';
  h += '<div class="bt-foot">四强之后进行单循环（3 轮），19:00-21:00 按胜场数决定名次。</div>';
  h += '</div>';
  return h;
}
(function(){
  var h = '<div class="seg" style="margin-bottom:12px">'
        + '<button id="del-m" class="on" onclick="pickElim(\'男\')">男单</button>'
        + '<button id="del-f" onclick="pickElim(\'女\')">女单</button></div>'
        + '<div id="elim-body"></div>';
  $('all-elim').innerHTML = h;
  window.pickElim = function(g){
    $('del-m').className = g==='男'?'on':'';
    $('del-f').className = g==='女'?'on':'';
    $('elim-body').innerHTML = bracketHTML(g);
  };
  window.pickElim('男');
})();

// 手机 / 微信缓存自愈：页面文件更新后，旧缓存的页面会自动带时间戳重载一次
(function(){
  var VERSION = '11-28d';
  var KEY = 'qcb_page_version';
  try{
    var seen = localStorage.getItem(KEY);
    localStorage.setItem(KEY, VERSION);
    if(seen && seen !== VERSION && location.search.indexOf('v=') < 0){
      location.replace(location.pathname + '?v=' + Date.now());
    }
  }catch(e){}
})();
</script>
</body>
</html>
